name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  # Une PR resout une issue du backlog : sans mot-cle de fermeture, l'issue resterait
  # ouverte apres le merge et le backlog cesserait de refleter l'etat reel du projet.
  lien-issue:
    name: La PR ferme une issue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Chercher un mot-cle de fermeture dans le corps de la PR
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          motif='(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'
          if ! printf '%s' "$PR_BODY" | grep -qiE "$motif"; then
            echo "::error::Cette PR ne ferme aucune issue. Ajouter « Closes #N » dans sa description."
            exit 1
          fi
          printf '%s' "$PR_BODY" | grep -ioE "$motif"

  qualite:
    name: Linters et tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-groups

      - name: ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

      - name: pytest
        run: uv run pytest
