name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.5"

jobs:
  # A PR resolves a backlog issue: without a closing keyword the issue would stay
  # open after the merge and the backlog would stop reflecting the real state of the project.
  issue-link:
    name: The PR closes an issue
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Look for a closing keyword in the PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          pattern='(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'
          if ! printf '%s' "$PR_BODY" | grep -qiE "$pattern"; then
            echo "::error::This PR closes no issue. Add « Closes #N » to its description."
            exit 1
          fi
          printf '%s' "$PR_BODY" | grep -ioE "$pattern"

  quality:
    name: Linters and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-groups

      - name: ruff (lint)
        run: uv run ruff check --output-format=github .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy (strict)
        run: uv run mypy

      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: no-commit-to-branch

      - name: pytest (without the foundation tests)
        run: uv run pytest -m "not foundation"

  foundation:
    name: Executable foundation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true

      - run: uv sync --all-groups

      - run: make up

      - run: make test

      - run: make scenarios

      - name: Container logs
        if: failure()
        run: docker compose logs --tail=200
